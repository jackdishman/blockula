# Alert rules for Blockula nodes and their hosts. Severities: critical pages someone now,
# warning goes to the operator channel, info is for the dashboard and the weekly review.
# Every alert links its runbook in docs/OPERATIONS.md. Unit tests: alerts.test.yml
# (`promtool test rules`, run by deploy/monitoring/check.sh in CI).
#
# Thresholds come from the protocol: 1 s blocks, MAX_EXEC_LAG = 16 and MAX_CLOCK_DRIFT_MS = 1000
# (node/src/consensus.rs), MAX_MEMPOOL = 5000 (node/src/chain.rs). Change them with the code.
#
# Staking (node/src/staking.rs): the node exports leader-slot misses, jail and tombstone flags
# per validator; its own validator's series carry `own="1"`, which is what these alerts watch.
groups:
  - name: blockula-recording
    rules:
      # Votes needed for a certificate with n active validators: n - ⌊(n-1)/3⌋ (simplex N3f1).
      - record: blockula:quorum
        expr: blockula_active_validators - floor((blockula_active_validators - 1) / 3)

  - name: blockula-chain
    rules:
      - alert: BlockulaNodeDown
        expr: up{job="blockula"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.node }}: /metrics unreachable (process down or HTTP wedged)"
          runbook_url: https://github.com/jackdishman/blockula/blob/main/docs/OPERATIONS.md#node-down

      # The executed head is older than 10 blocks: the same rule as /api/health.
      - alert: BlockulaHeadStale
        expr: blockula_head_age_seconds > 10
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }}: no new block executed for {{ $value | humanizeDuration }}"
          runbook_url: https://github.com/jackdishman/blockula/blob/main/docs/OPERATIONS.md#head-stale

      # Not one scraped node has a fresh head: the chain itself has stopped (fewer than a quorum
      # voting, or every validator failing the same block).
      - alert: BlockulaChainHalted
        expr: min(blockula_head_age_seconds) > 60
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Chain halted: the freshest node's head is {{ $value | humanizeDuration }} old"
          runbook_url: https://github.com/jackdishman/blockula/blob/main/docs/OPERATIONS.md#chain-halted

      # Finalized but not yet executed. Past MAX_EXEC_LAG this validator's proposals are invalid.
      - alert: BlockulaExecutionLagging
        expr: blockula_finalized_lag > 8
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }}: execution is {{ $value }} blocks behind finality"
          runbook_url: https://github.com/jackdishman/blockula/blob/main/docs/OPERATIONS.md#execution-lagging
      - alert: BlockulaExecutionPastMaxLag
        expr: blockula_finalized_lag > 16
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.node }}: execution is {{ $value }} blocks behind finality (max 16)"
          runbook_url: https://github.com/jackdishman/blockula/blob/main/docs/OPERATIONS.md#execution-lagging

      - alert: BlockulaMempoolNearCap
        expr: blockula_mempool_size > 4000
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }}: mempool at {{ $value }} of 5000; new txs are refused when full"
          runbook_url: https://github.com/jackdishman/blockula/blob/main/docs/OPERATIONS.md#mempool-full

      - alert: BlockulaTxRejectionsHigh
        expr: rate(blockula_tx_rejected_total[5m]) > 1 and rate(blockula_tx_rejected_total[5m]) > rate(blockula_tx_submitted_total[5m])
        for: 10m
        labels: { severity: info }
        annotations:
          summary: "{{ $labels.node }}: more txs rejected than accepted over HTTP (spam or a broken client)"
          runbook_url: https://github.com/jackdishman/blockula/blob/main/docs/OPERATIONS.md#mempool-full

      # The process start time is exact; a falling height also catches a restart before it.
      - alert: BlockulaRestarted
        expr: (time() - blockula_process_start_time_seconds < 900) or (blockula_height < max_over_time(blockula_height[15m]))
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }}: the node restarted in the last 15 minutes"
          runbook_url: https://github.com/jackdishman/blockula/blob/main/docs/OPERATIONS.md#restarts

      - alert: BlockulaVersionMismatch
        expr: count(count by (version) (blockula_build_info)) > 1
        for: 1h
        labels: { severity: info }
        annotations:
          summary: "Your nodes run {{ $value }} different blockula versions"
          runbook_url: https://github.com/jackdishman/blockula/blob/main/docs/OPERATIONS.md#upgrades

  # Upgrades and halts (node/src/upgrade.rs, MAINNET-DESIGN 3.9).
  - name: blockula-upgrades
    rules:
      # Stopped executing on purpose: --halt-height, or a protocol version this binary doesn't run.
      # A full node keeps serving reads (this fires); a validator exits (BlockulaNodeDown fires).
      - alert: BlockulaHalted
        expr: blockula_halted == 1
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.node }}: halted at block {{ with printf `blockula_height{node=\"%s\"}` $labels.node | query }}{{ . | first | value }}{{ end }} (/api/health says why)"
          runbook_url: https://github.com/jackdishman/blockula/blob/main/docs/OPERATIONS.md#halted

      # Governance scheduled a protocol version this binary doesn't run: the node will stop at its
      # activation height. Install the release before then.
      - alert: BlockulaUpgradeRequired
        expr: blockula_upgrade_next_version > blockula_supported_protocol_version
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }}: protocol v{{ $value }} is scheduled and this binary doesn't run it; upgrade before the activation height"
          runbook_url: https://github.com/jackdishman/blockula/blob/main/docs/OPERATIONS.md#upgrade-required
      - alert: BlockulaUpgradeRequiredSoon
        expr: blockula_upgrade_next_version > blockula_supported_protocol_version and (blockula_upgrade_next_height - blockula_height) < 86400
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.node }}: protocol v{{ $value }} activates within a day and this binary doesn't run it: the node will halt there"
          runbook_url: https://github.com/jackdishman/blockula/blob/main/docs/OPERATIONS.md#upgrade-required

  - name: blockula-validators
    rules:
      # blockula_validators_online counts the signers on the newest finalization certificate.
      # Certificates stop collecting at a quorum, so it's a lower bound on who is online, not a
      # census: halts show up as BlockulaChainHalted. Below quorum means the node's active set and
      # its certificates disagree.
      - alert: BlockulaCertificateBelowQuorum
        expr: blockula_validators_online < blockula:quorum
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.node }}: newest certificate has {{ $value }} signers, below quorum for its active set"
          runbook_url: https://github.com/jackdishman/blockula/blob/main/docs/OPERATIONS.md#validator-set

      # Fewer connected peers than a quorum needs besides this node: its votes and blocks may not
      # reach enough of the set. Validators only (full nodes have no p2p).
      - alert: BlockulaFewPeers
        expr: blockula_p2p_peers < blockula:quorum - 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }}: {{ $value }} p2p peers, fewer than a quorum needs"
          runbook_url: https://github.com/jackdishman/blockula/blob/main/docs/OPERATIONS.md#peers
      # In the active set but not linked to every other validator. Votes and blocks travel only
      # over direct links, so on a small set a missing link costs blocks: leaders without a
      # quorum's links time out (the blockula-testnet-2 launch stall). A restarted validator
      # re-links within seconds on `public-nat` and `local`, up to minutes on `recommended`.
      # Candidates and sentries linked to this node count as peers too.
      - alert: BlockulaMissingPeers
        expr: blockula_p2p_peers < blockula_active_validators - 1 and blockula_slashing_protection_voting == 1
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }}: {{ $value }} p2p peers, not linked to all {{ with printf `blockula_active_validators{node=\"%s\"} - 1` $labels.node | query }}{{ . | first | value }}{{ end }} other validators"
          runbook_url: https://github.com/jackdishman/blockula/blob/main/docs/OPERATIONS.md#peers

      # Slashing protection (node/src/protection.rs). The record only moves forward: going back
      # means the home was restored from a backup or copied. Stop the validator and investigate.
      - alert: BlockulaSlashingProtectionRolledBack
        expr: (blockula_slashing_protection_epoch < blockula_slashing_protection_epoch offset 1m) or (blockula_slashing_protection_last_view < blockula_slashing_protection_last_view offset 1m and blockula_slashing_protection_epoch == blockula_slashing_protection_epoch offset 1m)
        keep_firing_for: 30m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.node }}: the slashing-protection record went backwards (a restored or copied home?)"
          runbook_url: https://github.com/jackdishman/blockula/blob/main/docs/OPERATIONS.md#slashing-protection
      # In the active set, the chain advancing, and this validator signing nothing.
      - alert: BlockulaValidatorNotSigning
        expr: blockula_slashing_protection_voting == 1 and changes(blockula_slashing_protection_last_view[10m]) == 0 and changes(blockula_height[10m]) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }}: in the active set but hasn't signed a vote for 10 minutes while the chain advanced"
          runbook_url: https://github.com/jackdishman/blockula/blob/main/docs/OPERATIONS.md#slashing-protection
      # After a start a validator watches the network for a few seconds (up to ~20 s if the
      # network can't progress without it) before it signs. Minutes means something is wrong.
      - alert: BlockulaWatchingAfterStart
        expr: blockula_slashing_protection_abstaining == 1
        for: 3m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }}: still not signing, watching the network after a start"
          runbook_url: https://github.com/jackdishman/blockula/blob/main/docs/OPERATIONS.md#slashing-protection

      # Staking: this node's validator was jailed (missed too many leader slots, or a beacon
      # reveal) or tombstoned (double-signed). Jailed: it left the set and lost a light slash;
      # tombstoned: it's out for good. Both page.
      - alert: BlockulaValidatorJailed
        expr: blockula_validator_jailed{own="1"} == 1
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.node }}: validator {{ $labels.validator }} is jailed"
          runbook_url: https://github.com/jackdishman/blockula/blob/main/docs/OPERATIONS.md#jailed-or-tombstoned
      - alert: BlockulaValidatorTombstoned
        expr: blockula_validator_tombstoned{own="1"} == 1
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.node }}: validator {{ $labels.validator }} was tombstoned for double-signing"
          runbook_url: https://github.com/jackdishman/blockula/blob/main/docs/OPERATIONS.md#jailed-or-tombstoned
      # Half the misses its downtime window allows: act before it's jailed.
      - alert: BlockulaValidatorMissingSlots
        expr: blockula_validator_missed_slots{own="1"} > on(job, instance, node) group_left blockula_downtime_max_missed / 2
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }}: validator {{ $labels.validator }} missed {{ $value }} of its recent leader slots (jailed past {{ with printf `blockula_downtime_max_missed{node=\"%s\"}` $labels.node | query }}{{ . | first | value }}{{ end }})"
          runbook_url: https://github.com/jackdishman/blockula/blob/main/docs/OPERATIONS.md#jailed-or-tombstoned

      # The randomness beacon: this validator committed to a secret and didn't reveal it, so it
      # was jailed and slashed (the secrets file, the fee payer or the node was down).
      - alert: BlockulaBeaconRevealMissed
        expr: blockula_beacon_own_missed == 1
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }}: this validator didn't reveal its randomness beacon secret this epoch (jailed for it)"
          runbook_url: https://github.com/jackdishman/blockula/blob/main/docs/OPERATIONS.md#jailed-or-tombstoned

      # NaN: no finalization certificate among the last 16 executed heights.
      - alert: BlockulaNoRecentCertificate
        expr: blockula_validators_online != blockula_validators_online
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }}: no recent finalization certificate (cut off from validators, or still syncing)"
          runbook_url: https://github.com/jackdishman/blockula/blob/main/docs/OPERATIONS.md#validator-set

  - name: host
    rules:
      - alert: HostDiskAlmostFull
        expr: 1 - node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|nsfs|fuse.*"} / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|nsfs|fuse.*"} > 0.80
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }}: {{ $labels.mountpoint }} is {{ $value | humanizePercentage }} full"
          runbook_url: https://github.com/jackdishman/blockula/blob/main/docs/OPERATIONS.md#disk
      - alert: HostDiskCritical
        expr: 1 - node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|nsfs|fuse.*"} / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|nsfs|fuse.*"} > 0.90
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.node }}: {{ $labels.mountpoint }} is {{ $value | humanizePercentage }} full"
          runbook_url: https://github.com/jackdishman/blockula/blob/main/docs/OPERATIONS.md#disk
      - alert: HostDiskFillsWithinAWeek
        expr: predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|nsfs|fuse.*"}[6h], 7 * 86400) < 0
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }}: {{ $labels.mountpoint }} fills within 7 days at the current rate"
          runbook_url: https://github.com/jackdishman/blockula/blob/main/docs/OPERATIONS.md#disk

      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }}: only {{ $value | humanizePercentage }} of memory available"
          runbook_url: https://github.com/jackdishman/blockula/blob/main/docs/OPERATIONS.md#memory
      - alert: HostOomKill
        expr: increase(node_vmstat_oom_kill[15m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }}: the kernel OOM-killed a process"
          runbook_url: https://github.com/jackdishman/blockula/blob/main/docs/OPERATIONS.md#memory

      # Verifiers reject blocks more than 1 s ahead of their own clock, so skew costs votes long
      # before it reaches a second.
      - alert: HostClockSkew
        expr: abs(node_timex_offset_seconds) > 0.1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }}: clock off by {{ $value | humanizeDuration }}"
          runbook_url: https://github.com/jackdishman/blockula/blob/main/docs/OPERATIONS.md#time
      - alert: HostClockSkewCritical
        expr: abs(node_timex_offset_seconds) > 0.25
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.node }}: clock off by {{ $value | humanizeDuration }}"
          runbook_url: https://github.com/jackdishman/blockula/blob/main/docs/OPERATIONS.md#time
      - alert: HostClockNotSynchronising
        expr: min_over_time(node_timex_sync_status[5m]) == 0 and node_timex_maxerror_seconds >= 16
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }}: the clock isn't synchronised (NTP down?)"
          runbook_url: https://github.com/jackdishman/blockula/blob/main/docs/OPERATIONS.md#time

  - name: meta
    rules:
      # Always firing. Alertmanager sends it to an external dead man's switch, which pages when the
      # heartbeat stops: that's how you learn this whole host (or its monitoring) is gone.
      - alert: Watchdog
        expr: vector(1)
        labels: { severity: none }
        annotations:
          summary: "Heartbeat: the alerting pipeline works"
          runbook_url: https://github.com/jackdishman/blockula/blob/main/docs/OPERATIONS.md#alerting-pipeline
      - alert: AlertmanagerNotificationsFailing
        expr: rate(alertmanager_notifications_failed_total[5m]) > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Alertmanager can't deliver to {{ $labels.integration }}: alerts are going nowhere"
          runbook_url: https://github.com/jackdishman/blockula/blob/main/docs/OPERATIONS.md#alerting-pipeline
      - alert: PrometheusRuleFailures
        expr: increase(prometheus_rule_evaluation_failures_total[5m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "Prometheus failed to evaluate alert rules"
          runbook_url: https://github.com/jackdishman/blockula/blob/main/docs/OPERATIONS.md#alerting-pipeline
