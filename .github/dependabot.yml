# Weekly, grouped dependency updates. Every new version waits a week before Dependabot proposes it
# (cooldown), so a hijacked release is usually yanked before it reaches a PR. Security updates skip
# the cooldown. Consensus and crypto crates get their own PRs: they can change block validity, so
# review them alone and run the simulator and local testnet.
version: 2
updates:
  # The node (with the vendored p2p stream, a workspace member), Ghost Mode's core and the programs
  # engine with its test guests (each its own workspace and lockfile), so their exact pins are
  # surfaced too.
  - package-ecosystem: cargo
    directories: ["/node", "/node/ghost", "/node/vm", "/node/vm/guests"]
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(cargo)" }
    groups:
      # Every crate the manifests pin exactly (`=`, checked by scripts/check-pins.sh) because it
      # decides a consensus format, the state root, signatures, keys or the transport: the record
      # encoding and state maps (borsh, imbl), the database format (redb), the tx JSON parser
      # (serde_json), consensus and its crypto (commonware-*, ml-dsa, blake3, bech32), Ghost Mode's
      # STARK (p3-*), the transport's KEM and key handling (ml-kem, x25519-dalek, zeroize), the
      # programs engine and its upload parser (soroban-wasmi and its wasmi_* crates, wasmparser*;
      # wasmi, the test oracle). A bump
      # can change block validity without a protocol version, which only a network of old and new
      # binaries would show: its PR is reviewed alone, with the simulator, the local testnet and a
      # mixed-version run, never merged as part of the catch-all batch below (audit F78).
      consensus-and-crypto:
        patterns: ["commonware-*", "ml-dsa", "ml-kem", "blake3", "bech32", "borsh", "borsh-*", "imbl", "imbl-*", "redb", "serde_json", "arc-swap", "p3-*", "x25519-dalek", "zeroize", "getrandom", "rand_core", "soroban-wasmi", "wasmi", "wasmi_*", "wasmparser*"]
      cargo:
        patterns: ["*"]
    ignore:
      # The programs validator is calibrated and fuzzed on 0.228.0. Upgrade deliberately,
      # with the parser API changes, renewed calibration and fuzzing in the same work.
      - dependency-name: wasmparser
      # wasmi 0.38.0 is node/vm's test-only differential oracle (`ref038`), the last audited
      # release, kept there on purpose: only its patch releases are proposed.
      - dependency-name: wasmi
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # parking_lot 0.13 drops its locks' eventual fairness and rewrites lock_api's raw locks
      # (parking_lot#533, #544). The chain's state sits behind one of its mutexes, which
      # consensus, sync and the API all take. Upgrade deliberately, with a run that loads the API
      # beside consensus; 0.12's patch releases are still proposed.
      - dependency-name: parking_lot
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(npm)" }
    groups:
      crypto:
        patterns: ["@noble/*", "@scure/*"]
      runtime:
        dependency-type: production
      dev:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "deps(actions)" }
    groups:
      actions:
        patterns: ["*"]

  # Digest bumps for the pinned images. The rust tag moves only with rust-toolchain.toml, by hand
  # (scripts/check-pins.sh fails CI if they disagree).
  - package-ecosystem: docker
    directory: /deploy
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "deps(docker)" }
    ignore:
      - dependency-name: rust
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /deploy/monitoring
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "deps(monitoring)" }
    groups:
      monitoring:
        patterns: ["*"]
