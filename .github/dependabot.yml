# Weekly, grouped dependency updates. Every new version waits a week before Dependabot proposes it
# (cooldown), so a hijacked release is usually yanked before it reaches a PR. Security updates skip
# the cooldown. Consensus and crypto crates get their own PRs: they can change block validity, so
# review them alone and run the simulator and local testnet.
version: 2
updates:
  # The node (with the vendored p2p stream, a workspace member) and Ghost Mode's core (its own
  # workspace and lockfile), so their exact pins are surfaced too.
  - package-ecosystem: cargo
    directories: ["/node", "/node/ghost"]
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(cargo)" }
    groups:
      # Every crate the manifests pin exactly (`=`, checked by scripts/check-pins.sh) because it
      # decides a consensus format, the state root, signatures, keys or the transport: the record
      # encoding and state maps (borsh, imbl), the database format (redb), the tx JSON parser
      # (serde_json), consensus and its crypto (commonware-*, ml-dsa, blake3, bech32), Ghost Mode's
      # STARK (p3-*), the transport's KEM and key handling (ml-kem, x25519-dalek, zeroize). A bump
      # can change block validity without a protocol version, which only a network of old and new
      # binaries would show: its PR is reviewed alone, with the simulator, the local testnet and a
      # mixed-version run, never merged as part of the catch-all batch below (audit F78).
      consensus-and-crypto:
        patterns: ["commonware-*", "ml-dsa", "ml-kem", "blake3", "bech32", "borsh", "borsh-*", "imbl", "imbl-*", "redb", "serde_json", "arc-swap", "p3-*", "x25519-dalek", "zeroize", "getrandom", "rand_core"]
      cargo:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(npm)" }
    groups:
      crypto:
        patterns: ["@noble/*", "@scure/*"]
      runtime:
        dependency-type: production
      dev:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "deps(actions)" }
    groups:
      actions:
        patterns: ["*"]

  # Digest bumps for the pinned images. The rust tag moves only with rust-toolchain.toml, by hand
  # (scripts/check-pins.sh fails CI if they disagree).
  - package-ecosystem: docker
    directory: /deploy
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "deps(docker)" }
    ignore:
      - dependency-name: rust
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /deploy/monitoring
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "deps(monitoring)" }
    groups:
      monitoring:
        patterns: ["*"]
