# Required status checks (audit supply-chain-B-3). The main-branch ruleset requires these jobs by
# their `name:`, so a job's name is an interface: renaming one without the ruleset leaves a
# required check that's never reported, and every PR waits on it. The intended ruleset is
# deploy/github/ruleset-main.json (the maintainer applies it with deploy/github/apply-rulesets.sh,
# docs/OPERATIONS.md "Repository settings"). scripts/check-required-checks.mjs (the `ops` job)
# fails unless this list, that file and the jobs that run on every pull request agree:
#   required: Node (Rust tests + local multi-validator testnet)
#   required: Packages + wallet build
#   required: Wallet e2e (Playwright, Chromium)
#   required: Clippy
#   required: Dependencies (cargo-deny, npm audit)
#   required: Supply-chain pins, workflows, monitoring config
#   required: ml-dsa (node)
#   required: @noble/post-quantum (SDK)
#   required: Fuzz harness
# (the last three are in crypto.yml and fuzz.yml). A new job that runs on pull requests is
# required too, unless it's listed here as "#   optional: <name>".
name: CI
on:
  push: { branches: [main] }
  pull_request:
  # Weekly: new RustSec / npm advisories surface even when nobody pushes.
  schedule: [{ cron: "17 6 * * 1" }]
  workflow_dispatch:

# Every job only reads the repo. Actions are pinned by commit SHA (scripts/check-pins.sh).
permissions:
  contents: read

# A new push to a PR cancels its stale run. Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  node:
    name: Node (Rust tests + local multi-validator testnet)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: node }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: cargo test --release --locked --manifest-path node/Cargo.toml
      # Hybrid X25519 + ML-KEM-768 p2p handshake (vendored commonware-stream, docs/PQ-TRANSPORT.md).
      - run: cargo test --release --locked --manifest-path node/Cargo.toml -p commonware-stream
      - run: bash node/vendor/commonware-stream/verify-vendor.sh
      # Ghost Mode core (disabled at genesis, docs/GHOST-MODE.md).
      - run: cargo test --release --locked --manifest-path node/ghost/Cargo.toml
      - run: npm run build -w @blockula/sdk && npm run build -w @blockula/mcp
      - name: 4 validators + full node + SDK e2e + CLI
        run: bash scripts/local-testnet.sh
      # The install, upgrade, patch and key-rotation runbooks in docs/OPERATIONS.md, pasted as
      # written, with the binary local-testnet.sh just built: each fails closed, and a release
      # can't vouch for itself (audit F49).
      - name: Release runbooks as pasted (real blockula release install|sign|verify)
        run: bash scripts/test-release-runbook.sh
      # The step after a chain launches (scripts/pin-network.sh), on a copy of the files it edits.
      - name: pin-network.sh (a launched chain pinned in the node, MCP, wallet and genesis/)
        run: bash scripts/test-pin-network.sh

  web:
    # Also the SDK vectors and the MCP's tests; the name stays what the ruleset requires.
    name: Packages + wallet build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w @blockula/sdk && npm run build -w @blockula/mcp && npm run build -w @blockula/web
      - name: ML-DSA-65 KATs and Rust ⇄ TS cross vectors (SDK)
        run: npm run test:kat -w @blockula/sdk
      - name: Passkey, state-proof and protocol v1 helper vectors (SDK)
        run: npm run test:vectors -w @blockula/sdk
      - name: MCP network pinning and release checks
        run: npm test -w @blockula/mcp
      - run: npm test -w @blockula/web
      - name: Explorer backdrop bundle is up to date
        run: npm run build:haunt && git diff --exit-code node/src/haunt.js

  wallet-e2e:
    name: Wallet e2e (Playwright, Chromium)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # The browser matching @playwright/test in package-lock.json, with its system libraries.
      - run: npx playwright install --with-deps chromium
      - run: npm run build -w @blockula/sdk
      # Testnet and mainnet production builds, a PRF virtual authenticator and a mock node
      # (web/playwright.config.ts).
      - run: npm run test:e2e -w @blockula/web
      - name: Traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: wallet-e2e-traces, path: web/test-results, if-no-files-found: ignore }

  clippy:
    name: Clippy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: node }
      # Blocking: correctness, suspicious, perf and a few restriction lints. The style and
      # complexity count goes to the job summary.
      - run: scripts/clippy.sh

  deps:
    name: Dependencies (cargo-deny, npm audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - name: Install cargo-deny 0.20.2 (checksum-pinned)
        run: |
          curl -fsSL -o /tmp/cargo-deny.tgz https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  /tmp/cargo-deny.tgz" | sha256sum -c -
          tar -xzf /tmp/cargo-deny.tgz -C /tmp --strip-components=1
          sudo install -m 755 /tmp/cargo-deny /usr/local/bin/cargo-deny
      # Advisories (RustSec), licenses, bans and sources, per deny.toml.
      - run: cargo deny --manifest-path node/Cargo.toml --locked check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      # Blocking for what ships (SDK, MCP, wallet); dev tooling is reported only.
      - name: npm audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=moderate
      - name: npm audit (all, non-blocking)
        continue-on-error: true
        run: npm audit

  ops:
    name: Supply-chain pins, workflows, monitoring config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Pins (actions by SHA, images by digest, toolchain parity, --locked)
        run: scripts/check-pins.sh
      - name: actionlint 1.7.12 (checksum-pinned)
        run: |
          curl -fsSL -o /tmp/actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -color
      - name: Prometheus config, alert rules and their unit tests; Alertmanager config; dashboard JSON
        run: deploy/monitoring/check.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      # Nothing here needs an install script (the yaml parser check-required-checks.mjs reads the
      # workflows with is pinned in package-lock.json), so none runs.
      - run: npm ci --ignore-scripts
      - name: Release signature tool (known-answer vector, tamper checks)
        run: node scripts/release-sig.mjs selftest
      - name: install.sh verification policy (offline fake release)
        run: bash scripts/test-install.sh
      # What the release signer checks before signing: install.sh, genesis and checkpoint files
      # are the reviewed commit's own (audit F49 round 3).
      - name: Release files against the tagged source (scripts/check-release-files.sh)
        run: bash scripts/test-release-files.sh
      # The public testnet's entrypoint (key seeding, checkpoint join, flags) under dash as in the
      # image, the Fly machine configurations, and launch.sh / set-github-token.sh against a
      # stand-in fly (retries, RESET, key removal, rolling restarts), offline.
      - name: Testnet deploy scripts (deploy/entrypoint.sh, fly-config.sh, launch.sh, set-github-token.sh)
        run: ENTRY_SH=dash bash deploy/test-deploy.sh
      # The public testnet's external watch (testnet-watch.yml): its checks and its alert issue,
      # against a mock node and a stand-in gh, offline.
      - name: Testnet watch (scripts/testnet-watch.sh against a mock node and a stand-in gh)
        run: bash scripts/test-testnet-watch.sh
      # The fuzz job runs in public: crashes stay out of its log and artifacts (supply-chain-B-1).
      - name: Fuzz crashes stay private (workflow, open findings)
        run: bash scripts/check-fuzz-workflow.sh
      - name: Fuzz crash sealing (a real age round trip)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends age
          REQUIRE_AGE=1 bash scripts/test-fuzz-seal.sh
      # The ruleset requires these jobs by name (supply-chain-B-3); the workflows are read with a
      # YAML parser, and what it can't read as GitHub does is refused (review-r3-supply-1).
      - name: Required checks match the ruleset (deploy/github/ruleset-main.json)
        run: node scripts/check-required-checks.mjs
      - name: Required-checks checker and ruleset script (offline fake gh)
        run: bash scripts/test-github-settings.sh
