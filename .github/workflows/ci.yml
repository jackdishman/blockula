# Required status checks (audit supply-chain-B-3). The main-branch ruleset requires these jobs by
# their `name:`, so a job's name is an interface: renaming one without the ruleset leaves a
# required check that's never reported, and every PR waits on it. The intended ruleset is
# deploy/github/ruleset-main.json (the maintainer applies it with deploy/github/apply-rulesets.sh,
# docs/OPERATIONS.md "Repository settings"). scripts/check-required-checks.mjs (the `ops` job)
# fails unless this list, that file and the jobs that run on every pull request agree:
#   required: Node (Rust tests + local multi-validator testnet)
#   required: Node unit tests (Rust)
#   required: Node v1 replay gate (release binary)
#   required: Node engines (p2p handshake, Ghost Mode, programs VM)
#   required: Packages + wallet build
#   required: Wallet e2e (Playwright, Chromium)
#   required: Clippy
#   required: Dependencies (cargo-deny, npm audit)
#   required: Supply-chain pins, workflows, monitoring config
#   required: ml-dsa (node)
#   required: @noble/post-quantum (SDK)
#   required: Fuzz harness
# (the last three are in crypto.yml and fuzz.yml). A new job that runs on pull requests is
# required too, unless it's listed here as "#   optional: <name>".
name: CI
on:
  push: { branches: [main] }
  pull_request:
  # Weekly: new RustSec / npm advisories surface even when nobody pushes.
  schedule: [{ cron: "17 6 * * 1" }]
  workflow_dispatch:

# Every job only reads the repo. Actions are pinned by commit SHA (scripts/check-pins.sh).
permissions:
  contents: read

# A new push to a PR cancels its stale run. Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # The node's checks run as four jobs side by side (each builds what it needs), so a PR waits
  # for the longest one rather than for all of them in a row.
  node-unit:
    name: Node unit tests (Rust)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { workspaces: node }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # The wallet nodes serve at /wallet/ (web/out), built into every binary as releases are.
      - run: npm run build:wallet
      - run: cargo test --release --locked --manifest-path node/Cargo.toml

  node-replay:
    name: Node v1 replay gate (release binary)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { workspaces: node }
      # The v1 replay gate (docs/REPLAY.md): this PR's binary replays the recorded v1 history in
      # node/testdata/replay through sync and startup, block by block (every certificate, cited
      # state root, tx outcome, block state root and record). `cargo test` (node-unit) runs the
      # same corpus in the test build, and shows a binary that diverges from it fails.
      - name: v1 replay gate (the recorded corpus)
        run: |
          cargo build --release --locked --manifest-path node/Cargo.toml
          for archive in node/testdata/replay/v1-*; do node/target/release/blockula replay "$archive"; done
      # The Python SDK (sdk-py/) against the same binary: its signing vectors (shared with the
      # TypeScript SDK) and a transfer and a name on a throwaway dev chain.
      - name: Python SDK (shared signing vectors and local dev-chain e2e)
        run: |
          python3 -m venv .venv-sdk-py
          .venv-sdk-py/bin/python -m pip install -c sdk-py/constraints.txt ./sdk-py
          .venv-sdk-py/bin/python -m unittest discover -s sdk-py/tests -v
          PYTHON=.venv-sdk-py/bin/python bash sdk-py/tests/local-e2e.sh

  node-engines:
    name: Node engines (p2p handshake, Ghost Mode, programs VM)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The node's workspace and the programs engine's (its own, like node/ghost).
          workspaces: |
            node
            node/vm
      # Hybrid X25519 + ML-KEM-768 p2p handshake (vendored commonware-stream, docs/PQ-TRANSPORT.md).
      - run: cargo test --release --locked --manifest-path node/Cargo.toml -p commonware-stream
      - run: bash node/vendor/commonware-stream/verify-vendor.sh
      # Ghost Mode core (disabled at genesis, docs/GHOST-MODE.md).
      - run: cargo test --release --locked --manifest-path node/ghost/Cargo.toml
      # The programs engine (protocol v2, docs/PROGRAMS.md, node/vm/README.md), then again with the
      # wasmi 0.38 differential oracle running every test beside soroban-wasmi (`ref038`: every
      # receipt but its fuel must agree).
      - run: cargo test --release --locked --manifest-path node/vm/Cargo.toml
      - run: cargo test --release --locked --manifest-path node/vm/Cargo.toml --features ref038
      # The committed guests (node/vm/tests/programs/*.wasm) rebuild byte for byte from their
      # sources with the pinned compiler: this Linux build is the reference.
      - name: Programs engine guests rebuild byte for byte (node/vm/guests/build.sh --check)
        run: rustup target add wasm32v1-none --toolchain 1.98.1 && node/vm/guests/build.sh --check

  # The release binary, live: the wallet it serves, a local multi-validator testnet with the SDK
  # and CLI against it, the programs SDK e2e, and the release runbooks.
  node:
    name: Node (Rust tests + local multi-validator testnet)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { workspaces: node }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # The wallet nodes serve at /wallet/ (web/out), built into the binary below as releases are.
      - run: npm run build:wallet
      - run: cargo build --release --locked --manifest-path node/Cargo.toml
      # That binary's /wallet/ on a fresh named chain: passkey onboarding, faucet, a name, a
      # payment, client-side navigation and the node's CSP (web/e2e/served.spec.ts).
      - name: Served wallet e2e (the node's /wallet/, Playwright)
        run: |
          npx playwright install chromium
          E2E_SERVED=only npm run test:e2e -w @blockula/web
      - run: npm run build -w @blockula/sdk && npm run build -w @blockula/mcp
      - name: 4 validators + full node + SDK e2e + CLI
        run: bash scripts/local-testnet.sh
      # The programs SDK e2e (docs/PROGRAMS-V0.md §8.4, WBS S7b): the SDK uploads, creates, calls and views real guests
      # against `blockula dev --programs` (a temporary home), and the v1 SDK e2e runs there too, where its refusals depend
      # on v2 being scheduled. The local testnet above is a v1 chain, where `test:programs` would skip: with
      # BLOCKULA_E2E_PROGRAMS=1 a chain without programs fails the script instead. Nothing else runs the live programs path,
      # so the recorded answers the unit tests, the MCP's and the explorers' tests serve can't drift from the node unseen.
      - name: SDK programs e2e (blockula dev --programs)
        run: |
          home=$(mktemp -d)
          BLOCKULA_HOME="$home" node/target/release/blockula dev --programs --port 7071 >"$home/dev.log" 2>&1 &
          dev=$!
          trap 'kill "$dev" 2>/dev/null || true' EXIT
          for _ in $(seq 1 90); do
            curl -fsS http://127.0.0.1:7071/api/status 2>/dev/null | grep -q '"height":[1-9]' && break
            kill -0 "$dev" 2>/dev/null || { cat "$home/dev.log"; exit 1; }
            sleep 1
          done
          export BLOCKULA_RPC=http://127.0.0.1:7071 BLOCKULA_E2E_PROGRAMS=1
          npm run test:programs -w @blockula/sdk
          npm test -w @blockula/sdk
      # The runbook test below runs a blockula built to trust its test release key (only the
      # blockula crate rebuilds), so the real key id the ceremony builds in doesn't change what it
      # runs (review-r4-supply-1). No release, image or reproduction enables the feature.
      - name: A blockula that trusts the test release key (--features test-release-key)
        run: cargo build --release --locked --manifest-path node/Cargo.toml --features test-release-key
      # The install, upgrade, patch and key-rotation runbooks in docs/OPERATIONS.md, pasted as
      # written, with the binary the step above just built: each fails closed, and a release
      # can't vouch for itself (audit F49).
      - name: Release runbooks as pasted (real blockula release install|sign|verify)
        run: bash scripts/test-release-runbook.sh
      # The step after a chain launches (scripts/pin-network.sh), on a copy of the files it edits.
      - name: pin-network.sh (a launched chain pinned in the node, MCP, wallet and genesis/)
        run: bash scripts/test-pin-network.sh

  web:
    # Also the SDK vectors and the MCP's tests; the name stays what the ruleset requires.
    name: Packages + wallet build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w @blockula/sdk && npm run build -w @blockula/mcp && npm run build -w @blockula/web
      - name: ML-DSA-65 KATs and Rust ⇄ TS cross vectors (SDK)
        run: npm run test:kat -w @blockula/sdk
      - name: Passkey, state-proof and protocol v1 helper vectors (SDK)
        run: npm run test:vectors -w @blockula/sdk
      - name: MCP network pinning and release checks
        run: npm test -w @blockula/mcp
      - run: npm test -w @blockula/web
      - name: Chain directory (chains/*.json, listed on blockula.app)
        run: node scripts/check-chains.mjs
      - name: Explorer backdrop bundle is up to date
        run: npm run build:haunt && git diff --exit-code node/src/haunt.js

  wallet-e2e:
    name: Wallet e2e (Playwright, Chromium)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # The browser matching @playwright/test in package-lock.json. No apt: the ubuntu-24.04 image
      # ships Chrome, so Chromium's system libraries are already there, and a job that needs
      # Ubuntu's package servers fails whenever the runners can't reach them (2026-11-11).
      - run: npx playwright install chromium
      - run: npm run build -w @blockula/sdk
      # Testnet and mainnet production builds, a PRF virtual authenticator and a mock node
      # (web/playwright.config.ts).
      - run: npm run test:e2e -w @blockula/web
      - name: Traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: wallet-e2e-traces, path: web/test-results, if-no-files-found: ignore }

  clippy:
    name: Clippy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            node
            node/vm
      # Blocking: correctness, suspicious, perf and a few restriction lints, on the node and the
      # programs engine. The style and complexity count goes to the job summary.
      - run: scripts/clippy.sh

  deps:
    name: Dependencies (cargo-deny, npm audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - name: Install cargo-deny 0.20.2 (checksum-pinned)
        run: |
          curl -fsSL -o /tmp/cargo-deny.tgz https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  /tmp/cargo-deny.tgz" | sha256sum -c -
          tar -xzf /tmp/cargo-deny.tgz -C /tmp --strip-components=1
          sudo install -m 755 /tmp/cargo-deny /usr/local/bin/cargo-deny
      # Advisories (RustSec), licenses, bans and sources, per deny.toml.
      - run: cargo deny --manifest-path node/Cargo.toml --locked check
      # The programs engine's own workspace and lockfile (node/vm), under the same policy.
      - run: cargo deny --manifest-path node/vm/Cargo.toml --locked check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      # Blocking for what ships (SDK, MCP, wallet); dev tooling is reported only.
      - name: npm audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=moderate
      - name: npm audit (all, non-blocking)
        continue-on-error: true
        run: npm audit

  ops:
    name: Supply-chain pins, workflows, monitoring config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Pins (actions by SHA, images by digest, toolchain parity, --locked)
        run: scripts/check-pins.sh
      - name: actionlint 1.7.12 (checksum-pinned)
        run: |
          curl -fsSL -o /tmp/actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -color
      - name: Prometheus config, alert rules and their unit tests; Alertmanager config; dashboard JSON
        run: deploy/monitoring/check.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      # Nothing here needs an install script (the yaml parser check-required-checks.mjs reads the
      # workflows with is pinned in package-lock.json), so none runs.
      - run: npm ci --ignore-scripts
      - name: Release signature tool (known-answer vector, tamper checks)
        run: node scripts/release-sig.mjs selftest
      # The nightly replay's staged archive (replay.yml): what it stages and refuses, offline.
      - name: Archive staging (scripts/stage-archive.sh against a stand-in oras)
        run: bash scripts/test-stage-archive.sh
      - name: install.sh verification policy (offline fake release)
        run: bash scripts/test-install.sh
      # What the release signer checks before signing: install.sh, genesis and checkpoint files
      # are the reviewed commit's own (audit F49 round 3).
      - name: Release files against the tagged source (scripts/check-release-files.sh)
        run: bash scripts/test-release-files.sh
      # npm-publish.yml's own publish script, as a dry run against tarballs packed here: a publish
      # command npm can't read fails on every PR instead of at release time (v0.5.0's dry run).
      - name: npm publish step (npm-publish.yml's script as a dry run)
        run: bash scripts/test-npm-publish.sh
      # The Fly deployment's entrypoint (key seeding, checkpoint join, flags) under dash as in the
      # image, the Fly machine configurations, and launch.sh / set-github-token.sh against a
      # stand-in fly (retries, RESET, key removal, rolling restarts), offline.
      - name: Fly deploy scripts (deploy/entrypoint.sh, fly-config.sh, launch.sh, set-github-token.sh, restart-gate.sh)
        run: ENTRY_SH=dash bash deploy/test-deploy.sh
      # The fuzz job runs in public: crashes stay out of its log and artifacts (supply-chain-B-1).
      - name: Fuzz crashes stay private (workflow, open findings)
        run: bash scripts/check-fuzz-workflow.sh
      # age 1.2.1 from its GitHub release (checksum-pinned), not apt: see the wallet e2e's note.
      - name: Fuzz crash sealing (a real age round trip)
        run: |
          curl -fsSL -o /tmp/age.tgz https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz
          echo "7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50  /tmp/age.tgz" | sha256sum -c -
          tar -xzf /tmp/age.tgz -C /tmp age/age age/age-keygen
          sudo install -m 755 /tmp/age/age /tmp/age/age-keygen /usr/local/bin/
          REQUIRE_AGE=1 bash scripts/test-fuzz-seal.sh
      # The nightly corpus is bounded so replaying it can't take the budget (scripts/fuzz-bound-corpus.sh).
      - name: Fuzz corpus bound (the script, and the workflow's use of it)
        run: bash scripts/test-fuzz-corpus.sh
      # The ruleset requires these jobs by name (supply-chain-B-3); the workflows are read with a
      # YAML parser, and what it can't read as GitHub does is refused (review-r3-supply-1).
      - name: Required checks match the ruleset (deploy/github/ruleset-main.json)
        run: node scripts/check-required-checks.mjs
      - name: Every citation of docs/PROGRAMS-V0.md names a section or amendment it has
        run: node scripts/check-spec-citations.mjs
      - name: Required-checks checker and ruleset script (offline fake gh)
        run: bash scripts/test-github-settings.sh
