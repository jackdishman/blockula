# Tag vX.Y.Z → reproducible `blockula` archives for Linux + macOS, install.sh, any committed
# genesis files, the embedded sync checkpoints, checksums.txt (whose first line names the tag),
# SLSA build provenance (GitHub artifact attestations) for every file, and a DRAFT release. It stays a draft until a maintainer
# has reproduced the Linux build, signed checksums.txt offline with the ML-DSA-65 release key and
# attached checksums.txt.sig (docs/OPERATIONS.md "Releases"). scripts/install.sh and the MCP's
# install_node download from the published release.
name: Release
on:
  push: { tags: ["v*"] }

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Tag is the crate version
    permissions: { contents: read }
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # install.sh and install_node refuse a binary whose `blockula --version` isn't the tag they
      # asked for, and provenance is checked against refs/tags/<tag> (audit supply-chain-B-2).
      - name: vX.Y.Z is node/Cargo.toml's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -nE 's/^version = "([^"]+)"/\1/p' node/Cargo.toml | head -n 1)
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::release tags are vX.Y.Z, got $TAG"; exit 1; }
          [ "$TAG" = "v$version" ] || { echo "::error::tag $TAG, but node/Cargo.toml's version is $version"; exit 1; }

  build:
    name: Build ${{ matrix.target }}
    needs: version
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds run in the pinned image (glibc 2.36), so anyone can rebuild them bit for bit.
          # The image must match scripts/reproduce-release.sh and rust-toolchain.toml (check-pins.sh).
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, container: "rust:1.98.1-bookworm@sha256:93ce27a88655056a51dbdd8f5f2d7ddc071c7b0070fb288a37b5a285fc83971e" }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, container: "rust:1.98.1-bookworm@sha256:93ce27a88655056a51dbdd8f5f2d7ddc071c7b0070fb288a37b5a285fc83971e" }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15 }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - name: GNU tar (macOS)
        if: runner.os == 'macOS'
        run: command -v gtar || brew install gnu-tar
      # No caches in release builds: a poisoned cache would ship.
      - name: Build and package (scripts/release-build.sh)
        shell: bash
        run: scripts/release-build.sh ${{ matrix.target }} dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blockula-${{ matrix.target }}
          path: dist/blockula-${{ matrix.target }}.tar.gz*
          if-no-files-found: error

  reproduce:
    name: Reproduce x86_64-unknown-linux-gnu
    # A second, independent build from a different directory on a fresh runner. The release is
    # blocked unless it's byte-identical to the build job's archive.
    needs: build
    permissions: { contents: read }
    runs-on: ubuntu-24.04
    container: "rust:1.98.1-bookworm@sha256:93ce27a88655056a51dbdd8f5f2d7ddc071c7b0070fb288a37b5a285fc83971e"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, path: elsewhere/rebuild/blockula }
      - name: Rebuild
        shell: bash
        working-directory: elsewhere/rebuild/blockula
        run: rustup toolchain install && scripts/release-build.sh x86_64-unknown-linux-gnu "$GITHUB_WORKSPACE/rebuilt"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: blockula-x86_64-unknown-linux-gnu, path: released }
      - name: Compare
        shell: bash
        run: |
          cat released/*.sha256 rebuilt/*.sha256
          cmp released/blockula-x86_64-unknown-linux-gnu.tar.gz rebuilt/blockula-x86_64-unknown-linux-gnu.tar.gz

  attest:
    name: Checksums + build provenance
    needs: [build, reproduce]
    permissions:
      contents: read
      id-token: write # Sigstore signing certificate for the attestation
      attestations: write # store the attestation on the repo
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: blockula-*, path: dist, merge-multiple: true }
      # release/ holds exactly what gets published: the archives, install.sh, any genesis files
      # committed under genesis/<chain id>/genesis.json (docs/GENESIS_CEREMONY.md), the sync
      # checkpoints compiled into the binary (node/checkpoints/, OPERATIONS.md "Weak
      # subjectivity"), checksums.txt.
      # checksums.txt's first line names the tag (scripts/release-checksums.sh), so the offline
      # signature binds the files to this version.
      - name: checksums.txt
        id: files
        env:
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          (cd dist && sha256sum -c ./*.tar.gz.sha256)
          mkdir release
          cp dist/*.tar.gz scripts/install.sh release/
          for g in genesis/*/genesis.json; do cp "$g" "release/genesis-$(basename "$(dirname "$g")").json"; done
          for c in node/checkpoints/*.json; do cp "$c" "release/checkpoints-$(basename "$c")"; done
          scripts/release-checksums.sh "$TAG" release
          { echo 'subjects<<EOF'; ls -1 release/*; echo EOF; } >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.files.outputs.subjects }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release/
          if-no-files-found: error

  release:
    name: Draft release
    needs: attest
    permissions: { contents: write } # create the draft release and upload its assets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: release-files, path: release }
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<EOF
          Upgrade: \`blockula release install $TAG --provenance\`. It checks \`checksums.txt\` (its first line
          names $TAG) against the offline signature \`checksums.txt.sig\` by the Blockula release key
          (ML-DSA-65) whose key id you pinned at your first install, then the archive's SHA-256,
          provenance and the binary's version, and never runs this release's install.sh. A first
          install checks the archive against the SHA-256 announced in the operators' channel first:
          docs/OPERATIONS.md "A first install". Take the release key id from SECURITY.md, the website
          and the operators' channel, never from this page. Every file also has SLSA build provenance
          (\`gh attestation verify <file> --repo $REPO --source-ref refs/tags/$TAG\`), which a
          compromised GitHub account or workflow could produce as well. The Linux archives rebuild bit
          for bit with \`COMMIT=<commit> scripts/reproduce-release.sh $TAG\`.

          Developers: \`curl -fsSL https://github.com/$REPO/releases/download/$TAG/install.sh | BLOCKULA_VERSION=$TAG sh\`
          (the release's own script: it checks what it can, but it's only as trustworthy as this release).
          EOF
          gh release create "$TAG" release/* \
            --repo "$REPO" --draft --verify-tag --title "Blockula $TAG" --notes-file notes.md --generate-notes
