# Drift between GitHub's settings and deploy/github (audit supply-chain-B-3). Rulesets change
# without a commit, so once a day this reads the live ones and fails if they differ from
# deploy/github/ruleset-*.json: a removed required check, a weakened review rule, a ruleset
# switched off. It only reads (GITHUB_TOKEN can't change rulesets, and GitHub doesn't show it the
# bypass actors, so those aren't compared). The maintainer reconciles a difference with
# deploy/github/apply-rulesets.sh (docs/OPERATIONS.md "Repository settings"). It never runs on
# pull requests, so it isn't a required check.
name: GitHub settings
on:
  schedule: [{ cron: "41 5 * * *" }]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rulesets:
    name: Rulesets match deploy/github
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Live rulesets against deploy/github/ruleset-*.json (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: deploy/github/apply-rulesets.sh --check
