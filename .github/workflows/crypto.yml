# SEC-2: ML-DSA-65 known-answer tests (NIST ACVP, Wycheproof) and the Rust ⇄ TypeScript
# cross-implementation vectors, for both implementations Blockula signs with. Offline: no node,
# no network beyond dependencies. See node/testdata/acvp/README.md.
name: Crypto KATs
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

# Every job only reads the repo. Actions are pinned by commit SHA (scripts/check-pins.sh).
permissions:
  contents: read

concurrency:
  group: crypto-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    # A required status check (ci.yml's header, deploy/github/ruleset-main.json): keep the name.
    name: ml-dsa (node)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: node }
      - name: Crypto dependencies are pinned exactly
        run: |
          for dep in ml-dsa blake3 bech32; do
            grep -Eq "^$dep = \"=[0-9]" node/Cargo.toml || { echo "::error::$dep must be pinned with = in node/Cargo.toml"; exit 1; }
          done
      - name: Known-answer and cross-implementation tests
        run: "cargo test --locked --manifest-path node/Cargo.toml kat:: -- --nocapture"

  ts:
    # A required status check (ci.yml's header, deploy/github/ruleset-main.json): keep the name.
    name: "@noble/post-quantum (SDK)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Crypto dependencies are pinned exactly
        run: |
          # shellcheck disable=SC2016 # JavaScript, not shell: nothing in it should expand
          node -e '
            const deps = require("./sdk-ts/package.json").dependencies;
            for (const d of ["@noble/post-quantum", "@noble/hashes", "@scure/base"])
              if (!/^\d+\.\d+\.\d+$/.test(deps[d] ?? "")) { console.error(`::error::${d} must be an exact version in sdk-ts/package.json`); process.exit(1); }'
      - name: Known-answer and cross-implementation tests
        run: npm run test:kat -w @blockula/sdk
