# Mainnet, watched from outside Fly (deploy/mainnet/README.md "Monitoring"): scripts/testnet-watch.sh
# with NETWORK=mainnet, every 5 minutes as GitHub's scheduler allows, against the public RPC named
# by the repository variable MAINNET_RPC (Settings → Secrets and variables → Actions → Variables;
# MAINNET_EXPECT_VALIDATORS, default 4, is the active set it expects). The same checks as the
# testnet's watch: /api/health, the chain id (blockula-1), finality advancing, the head's age, the
# active validators, none jailed or tombstoned. Until MAINNET_RPC is set (before mainnet launches)
# the job is skipped: nothing runs and nothing alerts. A failing check opens an issue labeled
# mainnet-alert that @-mentions the maintainer, so GitHub emails and pushes it, or comments on the
# one already open; the first run that passes every check comments "Recovered" and closes it. To
# prove delivery:
#   gh workflow run mainnet-watch.yml -f test_alert=true
# It's a free safety net, not a pager: GitHub's scheduler delays and drops runs. The external
# uptime checks and the paging stack in deploy/mainnet/README.md are what to rely on. It never
# runs on pull requests, so it isn't a required check.
name: Mainnet watch
on:
  schedule:
    # Off the top of the hour (GitHub's busiest), and off the testnet watch's minutes.
    - cron: "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: Open a test alert issue, to check its notification reaches the maintainer
        type: boolean
        default: false

# No permissions by default; the job's token can only read and write issues (the alert, its label).
permissions: {}

# One watch at a time, so two runs can't both open an alert issue.
concurrency: { group: mainnet-watch, cancel-in-progress: false }

jobs:
  watch:
    name: Mainnet (external watch)
    # Forks don't watch (their alerts would mention the maintainer), and nothing runs before
    # mainnet has an RPC to watch. If the repository moves, update its name here, or the watch stops.
    if: github.repository == 'jackdishman/blockula' && vars.MAINNET_RPC != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Check mainnet; open, update or close the alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          NETWORK: mainnet
          RPC: ${{ vars.MAINNET_RPC }}
          EXPECT_VALIDATORS: ${{ vars.MAINNET_EXPECT_VALIDATORS || '4' }}
          TEST_ALERT: ${{ inputs.test_alert }}
        run: bash scripts/testnet-watch.sh
