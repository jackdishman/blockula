<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>🧛 Blockula Explorer</title>
<style>
  :root { --bg:#0e0a14; --panel:#181121; --line:#2c2038; --text:#ece6f3; --dim:#9a8fab; --pumpkin:#ff8a2a; --blood:#e2385a; --slime:#8be36b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  a { color:var(--pumpkin); text-decoration:none; } a:hover { text-decoration:underline; }
  header { display:flex; gap:16px; align-items:center; padding:14px 24px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { margin:0; font-size:20px; } header h1 a { color:var(--text); }
  header form { flex:1; min-width:240px; }
  input { width:100%; padding:10px 14px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:15px; }
  nav a { margin-left:14px; color:var(--dim); }
  main { max-width:1100px; margin:0 auto; padding:24px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); gap:12px; margin-bottom:24px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .stat .v { font-size:22px; font-weight:600; } .stat .k { color:var(--dim); font-size:13px; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); align-items:center; }
  .row:last-child { border-bottom:0; }
  .dim { color:var(--dim); font-size:13px; }
  .mono { font-family:ui-monospace, Menlo, monospace; font-size:13px; word-break:break-all; }
  .summary { font-size:17px; }
  .pill { display:inline-block; padding:2px 8px; border-radius:99px; font-size:12px; background:#2a1d36; color:var(--slime); }
  .pill.pending { color:var(--pumpkin); }
  .pill.failed { color:#ff6b6b; }
  dl { display:grid; grid-template-columns:200px 1fr; gap:10px 16px; margin:0; } dt { color:var(--dim); }
  .term { border-bottom:1px dotted var(--dim); cursor:help; position:relative; }
  .term:hover::after { content:attr(data-tip); position:absolute; left:0; top:100%; margin-top:6px; width:300px; padding:10px 12px; border-radius:10px; background:#241830; border:1px solid var(--line); color:var(--text); font-size:13px; z-index:5; white-space:normal; }
  .learn { border-color:var(--pumpkin); }
  .learn ol { margin:8px 0 0; padding-left:20px; } .learn li { margin:6px 0; }
  h2 { font-size:16px; margin:0 0 8px; } .err { color:var(--blood); }
  details summary { cursor:pointer; color:var(--dim); margin-top:12px; }
</style>
</head>
<body>
<header>
  <h1><a href="#/">🧛 Blockula</a></h1>
  <form id="search"><input id="q" placeholder="Search a name (jack.boo), address, block # or tx…" autocomplete="off" /></form>
  <nav><a href="#/learn">📖 Learn</a><a href="#/">⛓️ Blocks</a><a href="#/validators">🧛 Validators</a><a href="#/mempool">⏳ Mempool</a><a href="#/hunts">🏹 Hunts</a><a href="#/contribute">🕯️ Contribute</a></nav>
</header>
<main id="app">Rising from the grave…</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const api = async (p) => { const r = await fetch("/api" + p); const j = await r.json(); if (!r.ok) throw new Error(j.error); return j; };
const ago = (ms) => { const s = Math.max(0, Math.round((Date.now() - ms) / 1000)); return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s/60)}m ago` : `${Math.round(s/3600)}h ago`; };

const GLOSSARY = {
  block: "A batch of transactions sealed together. Each block points to the one before it, forming a chain that can't be quietly rewritten.",
  height: "The block's position in the chain. Block #1 is the first block after genesis.",
  hash: "A 256-bit BLAKE3 fingerprint. Change one byte of the data and the fingerprint changes completely. Quantum computers only weaken hashes a little, so 256 bits stays safe.",
  signature: "Proof that the owner of a key approved this. Blockula uses ML-DSA-65 (NIST FIPS 204), a lattice-based scheme designed to resist quantum computers — unlike the ECDSA used by Bitcoin and Ethereum.",
  nonce: "A counter for each account. It stops anyone from replaying the same signed transaction twice.",
  fee: "What it costs to include a transaction. The base part is burned 🔥 forever, slowly reducing supply. It's priced by size because post-quantum signatures are bigger.",
  state_root: "A single hash summarizing every balance and name after this block. If two nodes agree on it, they agree on everything.",
  address: "Your account ID: bech32m('boo', BLAKE3(public key)). You rarely need to see it — names like jack.boo point to it.",
  name: "A human-readable .boo name that points to an address, like a domain name for your wallet.",
  finalized: "Included in a block. On Blockula, once a block is sealed it's final — no waiting for confirmations.",
  epoch: "A stretch of blocks with a fixed validator set. Changes to the set (new validators, removals) only take effect when the next epoch starts.",
  bond: "FANG a validator locks up to take part. It can be reclaimed one epoch after the validator leaves.",
  familiar: "An AI agent working for this account through a spend-limited session key. Its earnings go to the account that sponsors it.",
  hunt: "A bounty on a GitHub issue. The FANG is locked in escrow until the creator (or a Season 0 admin) awards it for a pull request, or it's refunded to everyone who funded it.",
  proposer: "The validator that proposed this block. A 2/3+ quorum of validators then voted (ML-DSA-65 signatures) to finalize it.",
  certificate: "The finality proof: ML-DSA-65 votes from a 2/3+ quorum of validators. Blocks finalized as an ancestor of a later block share that later block's certificate.",
  burned: "Fees destroyed forever. Burning offsets new issuance and ties the token's value to real network usage.",
  soul: "Reputation that can't be bought or transferred. It's earned when juries accept your work (or by serving well as a juror), it slowly decays, and it's lost for spam or vouching for fakes.",
  seance: "A review jury. Randomly drawn jurors with Soul compare pairs of merged PRs (“which mattered more?”), seal their votes, then reveal them. The outcome scores each claim and pays the pool out.",
  vouch: "Staking FANG (and your Soul) on a newcomer being a real, distinct person. If they turn out to be a sybil, the voucher loses both. Newcomers can decline a vouch.",
  claim: "A merged PR submitted for the contribution pool. Validators check GitHub that it's merged and authored by the claimant's linked handle, then a Séance judges it.",
  vesting: "Rewards unlock gradually (about 90 days). Until then they can be clawed back, e.g. if the PR is reverted or the account turns out to be fake.",
  pool: "FANG set aside to reward useful work. Each Séance pays out a quarter of it, split by jury scores, square-rooted per person so volume doesn't pay.",
};
const term = (key, text) => `<span class="term" data-tip="${esc(GLOSSARY[key])}">${esc(text ?? key)}</span>`;
const who = (l) => l ? `<a href="#/account/${esc(l.name && !l.name.includes(" ") ? l.name : l.address)}">${esc(l.name || l.short)}</a>` : "—";

const views = {
  async home() {
    const [s, blocks, v, health] = await Promise.all([
      api("/status"), api("/blocks?limit=15"), api("/validators").catch(() => null),
      fetch("/api/health").then((r) => r.json()).catch(() => ({ ok: false, reason: "unreachable" })),
    ]);
    const age = s.head_age_ms != null ? Math.round(s.head_age_ms / 1000) : null;
    return `
      <div class="card" style="margin-bottom:16px"><h2>${health.ok ? "🟢" : "🟠"} Network health</h2>
        <div class="grid">
          <div class="stat"><div class="v">#${s.height}</div><div class="k">height${s.syncing ? ` · syncing… ${Math.floor((s.sync_progress || 0) * 100)}% of ~#${s.network_height_claimed}` : ""}</div></div>
          <div class="stat"><div class="v">${age == null ? "—" : age + "s"}</div><div class="k">since the last block</div></div>
          <div class="stat"><div class="v">${s.active_validators}</div><div class="k"><a href="#/validators">validators</a> in ${term("epoch")} ${s.epoch}</div></div>
          <div class="stat"><div class="v">${s.mempool}</div><div class="k"><a href="#/mempool">pending txs</a></div></div>
        </div>
        ${health.ok ? "" : `<div class="dim">${esc(health.reason || "")}</div>`}
        ${s.history_from > 1 ? `<div class="dim">⚡ This node fast-synced from a certified snapshot at #${s.fast_synced_from}; history before #${s.history_from} isn't available on this node.</div>` : ""}
        ${v ? `<div class="dim">${v.blocks_until_next_epoch} blocks until epoch ${v.epoch + 1}${v.pending.length ? ` · ${v.pending.length} validator${v.pending.length == 1 ? "" : "s"} awaiting approval` : ""}</div>` : ""}
      </div>`
      + `
      <div class="grid">
        <div class="card stat"><div class="v">#${s.height}</div><div class="k">${term("height", "latest block")}</div></div>
        <div class="card stat"><div class="v">${esc(s.supply_display)}</div><div class="k">total supply</div></div>
        <div class="card stat"><div class="v">${esc(s.burned_display)}</div><div class="k">${term("burned", "🔥 burned")}</div></div>
        <div class="card stat"><div class="v">${s.accounts}</div><div class="k">accounts</div></div>
        <div class="card stat"><div class="v">${s.names}</div><div class="k">${term("name", ".boo names")}</div></div>
      </div>
      <div class="card learn" style="margin-bottom:24px">
        <h2>👻 New here?</h2>
        This is <b>${esc(s.chain_id)}</b>, a blockchain secured by <b>${term("signature", "post-quantum signatures")}</b>.
        Every second a new ${term("block")} is sealed. Click anything to dig in, or <a href="#/learn">take the 2-minute tour →</a>
      </div>
      <div class="card"><h2>Latest blocks</h2>
        ${blocks.map((b) => `<div class="row"><div><a href="#/block/${b.height}">#${b.height}</a> <span class="dim">${esc(b.summary)}</span></div><div class="dim">${ago(b.timestamp_ms)}</div></div>`).join("")}
      </div>`;
  },
  async block(id) {
    const b = await api("/block/" + id);
    return `
      <div class="card"><div class="summary">${esc(b.summary)}</div><div class="dim">${new Date(b.timestamp_ms).toLocaleString()} · ${ago(b.timestamp_ms)}</div></div><br>
      <div class="card"><dl>
        <dt>${term("height")}</dt><dd>#${b.height} · <a href="#/block/${b.height - 1}">← prev</a> · <a href="#/block/${b.height + 1}">next →</a></dd>
        <dt>${term("proposer")}</dt><dd>${who(b.proposer)}</dd>
        <dt>${term("hash", "block hash")}</dt><dd class="mono">${esc(b.hash)}</dd>
        <dt>${term("hash", "previous hash")}</dt><dd class="mono">${esc(b.prev_hash)}</dd>
        <dt>${term("state_root")}</dt><dd class="mono">${esc(b.state_root)}</dd>
        <dt>${term("certificate", "finality certificate")}</dt><dd>${b.signature_bytes ? `ML-DSA-65 quorum · ${b.signature_bytes.toLocaleString()} bytes` : "finalized via a later block's certificate"}</dd>
      </dl></div><br>
      <div class="card"><h2>Transactions (${b.tx_count})</h2>${b.txs.length ? b.txs.map(txRow).join("") : '<div class="dim">A quiet block. Nothing stirred. 🕸️</div>'}</div>`;
  },
  async tx(id) {
    const t = await api("/tx/" + id);
    if (t.status === "failed" && !t.from) {
      return `<div class="card"><div class="summary">❌ This transaction didn't go through</div><span class="pill failed">failed</span><p>${esc(t.error || "")}</p><p class="dim">It was dropped around block #${t.height}. Nothing moved; if it was included, only the fee was charged.</p></div>`;
    }
    return `
      <div class="card"><div class="summary">${esc(t.summary)}</div>
        <span class="pill ${t.status}">${term("finalized", t.status)}</span> ${t.height ? `in <a href="#/block/${t.height}">block #${t.height}</a>` : ""}
        ${t.error ? `<p>❌ The action failed: ${esc(t.error)}. The fee was still charged.</p>` : ""}
        ${t.memo ? `<p>💬 “${esc(t.memo)}”</p>` : ""}</div><br>
      <div class="card"><dl>
        <dt>From</dt><dd>${who(t.from)}</dd>
        ${t.to ? `<dt>To</dt><dd>${who(t.to)}</dd>` : ""}
        ${t.amount_display ? `<dt>Amount</dt><dd>${esc(t.amount_display)}</dd>` : ""}
        <dt>${term("fee")}</dt><dd>${esc(t.fee_display)}</dd>
        <dt>${term("nonce")}</dt><dd>${t.nonce}</dd>
        <dt>${term("signature")}</dt><dd>${esc(t.signature_scheme)} · ${t.size_bytes.toLocaleString()} byte transaction</dd>
        <dt>${term("hash", "transaction id")}</dt><dd class="mono">${esc(t.id)}</dd>
      </dl>
      <details><summary>Raw data (for the brave)</summary><pre class="mono">${esc(JSON.stringify(t.action, null, 2))}</pre></details></div>`;
  },
  async account(id) {
    const a = await api("/account/" + encodeURIComponent(id));
    let gh = null;
    if (a.github) gh = await api("/github/" + encodeURIComponent(a.github.handle)).catch(() => null);
    const bits = [esc(a.account.name || "Unnamed account")];
    if (a.github) bits.push(`GitHub <a href="https://github.com/${esc(a.github.handle)}">@${esc(a.github.handle)}</a> ${gh && gh.verified ? `<span class="pill" title="${esc(gh.reason)}">✓ verified</span>` : `<span class="pill pending" title="${esc(gh ? gh.reason : "not checked")}">unverified</span>`}`);
    if (a.hunts_won.length) bits.push(`${a.hunts_won.length} hunt${a.hunts_won.length == 1 ? "" : "s"} won`);
    if (a.familiars.length) bits.push(`${a.familiars.length} ${term("familiar", a.familiars.length == 1 ? "Familiar" : "Familiars")}`);
    const pc = a.contribution;
    if (pc && pc.soul.points > 0) bits.push(`${term("soul", "Soul")} ${esc(pc.soul.display)}`);
    if (pc && pc.sybil) bits.push(`<span class="pill failed" title="${esc(pc.sybil.reason)}">flagged as a sybil</span>`);
    return `
      <div class="card"><div class="summary">${bits.join(" · ")}</div>
        <div class="dim">${term("address")}: <span class="mono">${esc(a.account.address)}</span></div></div><br>
      ${a.hunts_won.length || a.familiars.length || a.hunts_created.length ? `<div class="card"><h2>🏹 Hunts</h2>
        ${a.hunts_won.map((h) => `<div class="row"><div><a href="#/hunt/${h.id}">${esc(h.repo)}#${h.issue}</a> won ${esc(h.amount_display)} for PR #${h.pr}${h.self_awarded ? ' <span class="pill pending">self-awarded</span>' : ""}</div></div>`).join("")}
        ${a.hunts_created.length ? `<div class="dim">Created ${a.hunts_created.map((id) => `<a href="#/hunt/${id}">#${id}</a>`).join(", ")}</div>` : ""}
        ${a.familiars.length ? `<div class="dim">Familiars: ${a.familiars.map((f) => `🐈‍⬛ ${esc(f.label)}`).join(", ")}</div>` : ""}</div><br>` : ""}
      ${pc && (pc.soul.points > 0 || pc.claims.length || pc.juror || pc.vouched_by || pc.vouching_for.length || pc.rewards.total_display !== "0 FANG") ? contributionCard(pc) : ""}
      <div class="grid">
        <div class="card stat"><div class="v">${esc(a.balance_display)}</div><div class="k">balance</div></div>
        <div class="card stat"><div class="v">${a.nonce}</div><div class="k">${term("nonce", "transactions sent")}</div></div>
        <div class="card stat"><div class="v">${a.names.length}</div><div class="k">${term("name", "names owned")}</div></div>
      </div>
      ${a.names.length ? `<div class="card"><h2>Names</h2>${a.names.map((n) => `<span class="pill">${esc(n)}</span> `).join("")}</div><br>` : ""}
      <div class="card"><h2>Recent activity</h2>${a.recent_txs.length ? a.recent_txs.map(txRow).join("") : '<div class="dim">No activity yet. Spooky quiet.</div>'}</div>`;
  },
  async name(n) {
    const r = await api("/name/" + n);
    return `<div class="card"><div class="summary">🪦 ${esc(r.name)} is unclaimed</div><p>Anyone can register it for <b>${esc(r.price_display)}</b>. Shorter names cost more because they're scarcer. The fee goes to the community treasury.</p>
      <p class="dim">Register it with the SDK: <span class="mono">await wallet.registerName("${esc(r.name)}")</span></p></div>`;
  },
  async learn() {
    const s = await api("/status");
    return `<div class="card learn"><h2>📖 Blockula in 2 minutes</h2><ol>
      <li><b>A blockchain is a shared notebook.</b> Thousands of computers keep identical copies, and new pages (${term("block", "blocks")}) are added every second. Each page includes a ${term("hash")} of the one before, so nobody can quietly rip one out.</li>
      <li><b>Your wallet is a key, not an account at a company.</b> Only your key can produce the ${term("signature")} that moves your FANG. Blockula's keys are unlocked by a <b>passkey</b> (Face ID / Touch ID), so there's no seed phrase to lose.</li>
      <li><b>Why "post-quantum"?</b> Future quantum computers could forge the signatures that Bitcoin and Ethereum use today. Blockula uses ML-DSA, a NIST-standardized scheme built on lattice math that quantum computers aren't known to break. The tradeoff: signatures are about 3 KB instead of 64 bytes.</li>
      <li><b>Names instead of gibberish.</b> Instead of <span class="mono">boo1qx…</span>, you send to <b>alice.boo</b>.</li>
      <li><b>Fees are burned.</b> Every transaction pays a small ${term("fee")}, and the base part is destroyed. So far ${esc(s.burned_display)} has been ${term("burned")}.</li>
      <li><b>Useful work gets paid.</b> Merged pull requests to Blockula can be ${term("claim", "claimed")} from the ${term("pool", "contribution pool")}. A ${term("seance", "Séance")} of jurors with ${term("soul", "Soul")} judges them, and rewards ${term("vesting", "vest")} slowly. <a href="#/contribute">See how →</a></li>
      <li><b>Coming soon: 👻 Ghost Mode.</b> Private transfers using zero-knowledge proofs (hash-based STARKs, also quantum-safe). The explorer will show <i>that</i> something happened, but not who or how much.</li>
    </ol><p>Try it: search for a name above, or open the <a href="#/">latest blocks</a> and click around. Every dotted word has an explanation if you hover.</p></div>`;
  },
};

views.hunts = async function () {
  const r = await api("/hunts");
  const row = (h) => `<div class="row"><div><a href="#/hunt/${h.id}"><b>${esc(h.amount_display)}</b> · ${esc(h.title)}</a>
    <span class="dim">· <a href="${esc(h.issue_url)}">${esc(h.repo)}#${h.issue}</a> · ${h.funders.length} funder${h.funders.length == 1 ? "" : "s"}</span></div><span class="pill ${h.status == "open" ? "" : "pending"}">${esc(h.status)}</span></div>`;
  return `<div class="card learn"><h2>🏹 Hunts</h2><p>${term("hunt", "Hunts")} are bounties on GitHub issues. Anyone can add to one. Fix the issue, get the pull request merged, and the bounty is awarded to your account (or to your ${term("familiar", "Familiar")}'s sponsor). Open bounties right now: <b>${esc(r.open_bounties_display)}</b>.</p>
    <p class="dim">Put one up with the SDK: <span class="mono">wallet.createHunt({ repo: "owner/name", issue: 12, amount: "50", title: "…", expiresInBlocks: 100000 })</span></p></div><br>
    <div class="card"><h2>All hunts (${r.count})</h2>${r.hunts.length ? r.hunts.map(row).join("") : '<div class="dim">No hunts yet.</div>'}</div>`;
};

views.hunt = async function (id) {
  const h = await api("/hunt/" + id);
  return `<div class="card"><div class="summary">🏹 ${esc(h.amount_display)} for <a href="${esc(h.issue_url)}">${esc(h.repo)}#${h.issue}</a></div>
      <p>“${esc(h.title)}”</p><span class="pill ${h.status == "open" ? "" : "pending"}">${esc(h.status)}</span></div><br>
    <div class="card"><dl>
      <dt>Created by</dt><dd>${who(h.creator)} at block <a href="#/block/${h.created_at}">#${h.created_at}</a></dd>
      <dt>Expires</dt><dd>block #${h.expires_at}</dd>
      ${h.awarded_to ? `<dt>Winner</dt><dd>${who(h.awarded_to)}${h.familiar ? ` (via their ${term("familiar", "Familiar")} 🐈‍⬛ ${esc(h.familiar)})` : ""} for <a href="${esc(h.pr_url)}">PR #${h.pr}</a>${h.self_awarded ? ' <span class="pill pending">self-awarded</span>' : ""}</dd><dt>Awarded by</dt><dd>${who(h.awarded_by)} at block #${h.awarded_at}</dd>` : ""}
      ${h.cancelled_at ? `<dt>Cancelled</dt><dd>block #${h.cancelled_at}; every funder was refunded what they put in</dd>` : ""}
    </dl></div><br>
    <div class="card"><h2>Funders (${h.funders.length})</h2>${h.funders.map((f) => `<div class="row"><div>${who(f.account)}</div><div>${esc(f.amount_display)}</div></div>`).join("")}</div>`;
};

const claimRow = (c) => `<div class="row"><div><a href="#/claim/${c.id}">claim #${c.id}</a> · <a href="${esc(c.pr_url)}">${esc(c.repo)}#${c.pr}</a> by ${who(c.claimant)}${c.familiar ? ` <span class="dim">via 🐈‍⬛ ${esc(c.familiar)}</span>` : ""}
  ${c.score_display ? ` <span class="dim">· score ${esc(c.score_display)}</span>` : ""}${c.payout !== "0" ? ` <span class="dim">· earned ${esc(c.payout_display)}</span>` : ""}</div><span class="pill ${["rejected", "spam"].includes(c.status) ? "failed" : c.status === "scored" ? "" : "pending"}">${esc(c.status.replace("_", " "))}</span></div>`;

function contributionCard(pc) {
  const r = pc.rewards;
  return `<div class="card"><h2>🕯️ Contribution</h2><dl>
    <dt>${term("soul", "Soul")}</dt><dd>${esc(pc.soul.display)} <span class="dim">(${esc(pc.soul.earned_display)} earned in total; it decays slowly)</span></dd>
    ${pc.vouched_by ? `<dt>${term("vouch", "Vouched for by")}</dt><dd>${who(pc.vouched_by.voucher)} at block #${pc.vouched_by.at}</dd>` : ""}
    ${pc.vouching_for.length ? `<dt>${term("vouch", "Vouching for")}</dt><dd>${pc.vouching_for.map((v) => who(v.account)).join(", ")}</dd>` : ""}
    ${pc.juror ? `<dt>${term("seance", "Juror")}</dt><dd>${pc.juror.active ? "in the pool" : "benched (missed a reveal; join again to return)"} · bond ${esc(pc.juror.bond_display)} · served on ${pc.juror.served} Séance${pc.juror.served == 1 ? "" : "s"}</dd>` : ""}
    <dt>${term("vesting", "Rewards")}</dt><dd>${esc(r.withdrawable_display)} withdrawable · ${esc(r.unvested_display)} still vesting</dd>
    ${pc.sybil ? `<dt>Flagged</dt><dd class="err">as a sybil by ${who(pc.sybil.by)}: “${esc(pc.sybil.reason)}”</dd>` : ""}
  </dl>${pc.claims.length ? `<br><h2>Claims</h2>${pc.claims.map(claimRow).join("")}` : ""}</div><br>`;
}

const phaseText = (s) => s.phase === "sealing" ? `🔒 sealing votes until block #${s.commit_until}` : s.phase === "revealing" ? `👁️ revealing until block #${s.reveal_until}` : `closed at block #${s.reveal_until}`;

views.contribute = async function () {
  const [c, souls, claims] = await Promise.all([api("/contributions"), api("/souls?limit=10"), api("/claims?limit=15")]);
  const s = c.open_seance;
  const r = c.rules;
  return `
    <div class="grid">
      <div class="card stat"><div class="v">${esc(c.pool.balance_display)}</div><div class="k">${term("pool", "contribution pool")}</div></div>
      <div class="card stat"><div class="v">${esc(c.pool.next_budget_display)}</div><div class="k">next ${term("seance", "Séance")} pays up to</div></div>
      <div class="card stat"><div class="v">${c.repos.length}</div><div class="k">repos in the pool</div></div>
      <div class="card stat"><div class="v">${c.jurors.active}</div><div class="k">jurors available</div></div>
    </div>
    <div class="card learn"><h2>🕯️ Get paid for useful work</h2><ol>
      <li><b>Link GitHub</b> (a public gist with your address) and get a pull request merged into a pool repo${c.repos.length ? ` (${c.repos.map((x) => `<a href="https://github.com/${esc(x.repo)}">${esc(x.repo)}</a>`).join(", ")})` : ""}.</li>
      <li><b>${term("claim", "Claim it")}</b> with a small refundable bond (${esc(r.claim_bond_display)}, more if you have several open). You need ${term("soul", "Soul")} or a ${term("vouch", "vouch")} from someone who has it.</li>
      <li><b>Validators check GitHub</b>: the PR must be merged and authored by your linked handle. ${r.claim_maturity_blocks ? `Then it waits ${r.claim_maturity_blocks.toLocaleString()} blocks in case it's reverted.` : ""}</li>
      <li><b>A ${term("seance", "Séance")} judges it.</b> Up to ${r.jury_size} jurors drawn at random compare pairs of claims, seal their votes, then reveal them. Jurors who agree with the outcome earn Soul and ${esc(r.juror_share)} of the payout; those who keep disagreeing lose Soul, and no-shows lose part of their bond.</li>
      <li><b>Payout.</b> Each Séance distributes up to ${esc(r.pool_share_per_seance)} of the pool (the full share once it has 16 claims). Your share is the <i>square root</i> of your summed scores (per GitHub handle), so one solid PR beats a pile of tiny ones, and spam costs you. Rewards ${term("vesting", "vest")} over ${r.vesting_blocks.toLocaleString()} blocks.</li>
    </ol><p class="dim">Agents can contribute as ${term("familiar", "Familiars")} of a human sponsor: the MCP's <span class="mono">submit_contribution</span>, or <span class="mono">blockula contrib claim owner/repo 123</span> from the CLI.</p></div><br>
    <div class="card"><h2>${s ? `Séance #${s.id} · ${phaseText(s)}` : "No Séance open"}</h2>
      ${s ? `<p>${s.claims.length} claims · ${s.jurors.length} jurors · budget ${esc(s.budget_display)} · <a href="#/seance/${s.id}">details →</a></p>${s.jurors.map((j) => `<span class="pill ${j.revealed ? "" : "pending"}">${esc(j.juror.name || j.juror.short)} ${j.revealed ? "✓ revealed" : j.committed ? "🔒 sealed" : "…"}</span> `).join("")}`
        : `<div class="dim">The next one can open from block #${c.next_seance_at} once at least 2 verified claims have matured and ${r.min_jury} jurors are available.</div>`}
    </div><br>
    ${c.recent_seances.length ? `<div class="card"><h2>Recent Séances</h2>${c.recent_seances.map((x) => `<div class="row"><div><a href="#/seance/${x.id}">Séance #${x.id}</a> <span class="dim">· ${x.claims} claims · ${x.jurors} jurors · ${x.results ? `${x.results.accepted} accepted, ${x.results.spam} spam` : ""}</span></div><div class="dim">paid ${esc(x.budget_display)} budget</div></div>`).join("")}</div><br>` : ""}
    <div class="card"><h2>Recent claims</h2>${claims.claims.length ? claims.claims.map(claimRow).join("") : '<div class="dim">No claims yet. Be the first.</div>'}</div><br>
    <div class="card"><h2>👻 Souls</h2>${souls.souls.length ? souls.souls.map((x, i) => `<div class="row"><div>${i + 1}. ${who(x.account)}${x.github ? ` <span class="dim">@${esc(x.github)}</span>` : ""}${x.juror ? ' <span class="pill">juror</span>' : ""}</div><div>${esc(x.soul.display)}</div></div>`).join("") : '<div class="dim">Nobody has Soul yet.</div>'}</div>`;
};

views.claim = async function (id) {
  const c = await api("/claim/" + id);
  return `<div class="card"><div class="summary">🕯️ Claim #${c.id}: <a href="${esc(c.pr_url)}">${esc(c.repo)}#${c.pr}</a> by ${who(c.claimant)} (@${esc(c.handle)})</div>
      <span class="pill ${["rejected", "spam"].includes(c.status) ? "failed" : c.status === "scored" ? "" : "pending"}">${esc(c.status.replace("_", " "))}</span>${c.reason ? ` <span class="dim">${esc(c.reason)}</span>` : ""}</div><br>
    <div class="card"><dl>
      <dt>Submitted</dt><dd>block #${c.submitted_at}${c.familiar ? ` by their ${term("familiar", "Familiar")} 🐈‍⬛ ${esc(c.familiar)}` : ""}</dd>
      <dt>${term("bond")}</dt><dd>${c.bond !== "0" ? esc(c.bond_display) + " (held until it's judged)" : "settled"}</dd>
      ${c.verified_at != null ? `<dt>Verified</dt><dd>block #${c.verified_at} · merge <span class="mono">${esc((c.merge_sha || "").slice(0, 12))}</span> · judged from block #${c.eligible_at}</dd>` : ""}
      ${c.expires_at ? `<dt>Refunded if unchecked by</dt><dd>block #${c.expires_at}</dd>` : ""}
      ${c.seance != null ? `<dt>${term("seance", "Séance")}</dt><dd><a href="#/seance/${c.seance}">#${c.seance}</a></dd>` : ""}
      ${c.score_display ? `<dt>Score</dt><dd>${esc(c.score_display)} of comparisons won · earned ${esc(c.payout_display)} (${term("vesting", "vesting")}) · +${esc(c.soul_awarded_display)} Soul</dd>` : ""}
    </dl></div><br>
    <div class="card"><h2>Validator checks (${c.attestations.length})</h2>${c.attestations.length ? c.attestations.map((a) => `<div class="row"><div>${who(a.validator)} ${a.ok ? `✓ merged as <span class="mono">${esc(a.merge_sha.slice(0, 12))}</span>` : `✗ ${esc(a.note || "GitHub doesn't confirm it")}`}</div><a class="dim" href="#/block/${a.at}">block #${a.at}</a></div>`).join("") : '<div class="dim">Waiting for validators to check GitHub…</div>'}</div>`;
};

views.seance = async function (id) {
  const s = await api("/seance/" + id);
  const r = s.results;
  return `<div class="card"><div class="summary">🕯️ Séance #${s.id} · ${phaseText(s)}</div>
      <div class="dim">opened at block #${s.opened_at} · budget ${esc(s.budget_display)} · jury drawn from seed <span class="mono">${esc(s.seed.slice(0, 16))}…</span></div>
      ${r ? `<p>${r.accepted} accepted · ${r.below_threshold} below the threshold · ${r.spam} spam · ${r.carried_over} carried over · ${r.no_shows} no-show${r.no_shows == 1 ? "" : "s"} · paid ${esc(s.results_display.paid)}, ${esc(s.results_display.returned)} back to the pool</p>` : ""}</div><br>
    <div class="card"><h2>Claims (${s.claims.length})</h2>${s.claims.map(claimRow).join("")}</div><br>
    <div class="card"><h2>Jury (${s.jurors.length})</h2>${s.jurors.map((j) => `<div class="row"><div>${who(j.juror)} <span class="dim">· ${j.pairs} pairs${j.agreement_display ? ` · agreed ${esc(j.agreement_display)}` : ""}${j.reward_display !== "0 FANG" ? ` · earned ${esc(j.reward_display)}` : ""}${j.soul_delta_display !== "0" ? ` · Soul ${esc(j.soul_delta_display)}` : ""}</span></div><span class="pill ${j.revealed ? "" : "pending"}">${j.revealed ? "revealed" : j.committed ? "sealed" : s.phase === "closed" ? "no-show" : "waiting"}</span></div>`).join("")}</div>`;
};

views.mempool = async function () {
  const m = await api("/mempool?limit=100");
  return `<div class="card learn"><h2>⏳ Waiting to be included</h2><p>Transactions this node has accepted but no block has finalized yet. Validators pick them up in the next few blocks; ones that can't apply anymore (or wait too long) are dropped.</p></div><br>
    <div class="card"><h2>Pending (${m.count})</h2>${m.txs.length ? m.txs.map(txRow).join("") : '<div class="dim">Nothing pending. 🕸️</div>'}</div>`;
};

views.validators = async function () {
  const v = await api("/validators");
  const row = (x) => `<div class="row"><div>${who(x.validator)} <span class="dim">${esc(x.p2p_addr)}${x.genesis ? " · genesis" : ""}${x.bond !== "0" ? " · " + term("bond", "bond") + " " + esc(x.bond_display) : ""}</span></div><span class="pill">${esc(x.status)}</span></div>`;
  const list = (title, xs, empty) => `<div class="card"><h2>${title} (${xs.length})</h2>${xs.length ? xs.map(row).join("") : `<div class="dim">${empty}</div>`}</div><br>`;
  const all = [...v.active, ...v.pending, ...v.approved, ...v.removed];
  const seen = new Set();
  const events = [];
  for (const x of all) {
    if (seen.has(x.validator.address)) continue;
    seen.add(x.validator.address);
    if (x.registered_at && !x.genesis) events.push([x.registered_at, `${who(x.owner)} bonded ${esc(x.bond_display)} and registered validator ${who(x.validator)}`]);
    if (x.approved_by) events.push([x.approved_at, `${who(x.approved_by)} approved validator ${who(x.validator)}${x.active_from_epoch != null ? `, active from ${term("epoch")} ${x.active_from_epoch}` : ", joining at the next epoch"}`]);
    if (x.removed_by) events.push([x.removed_at, `${who(x.removed_by)} removed validator ${who(x.validator)}${x.active_until_epoch != null ? `, last active in epoch ${x.active_until_epoch}` : ", leaving at the next epoch"}`]);
  }
  events.sort((a, b) => b[0] - a[0]);
  return `
    <div class="grid">
      <div class="card stat"><div class="v">${v.epoch}</div><div class="k">${term("epoch", "current epoch")}</div></div>
      <div class="card stat"><div class="v">${v.active.length}</div><div class="k">active validators</div></div>
      <div class="card stat"><div class="v">${v.blocks_until_next_epoch}</div><div class="k">blocks until the next epoch</div></div>
      <div class="card stat"><div class="v">${esc(v.min_bond_display)}</div><div class="k">${term("bond", "minimum bond")}</div></div>
    </div>
    <div class="card learn"><h2>🧛 What validators do</h2>
      <p>Validators take turns proposing blocks and vote to finalize them. A block is final once more than two-thirds of the active validators have signed it with ML-DSA-65, a post-quantum signature. There are no confirmations to wait for.</p>
      <p>The set only changes between ${term("epoch", "epochs")} (every ${v.epoch_blocks} blocks). In Season 0, anyone can bond FANG and register, and an admin (${v.admins.map(who).join(", ")}) approves them. Approved validators join when the next epoch starts.</p></div><br>
    ${list("Active this epoch", v.active, "—")}
    ${list("Next epoch", v.next_epoch, "—")}
    ${list("Waiting for approval", v.pending, "Nobody is waiting. Run <span class=\"mono\">blockula validator init</span> to become a validator.")}
    ${v.approved.length ? list("Approved, joining soon", v.approved, "") : ""}
    ${v.removed.length ? list("Removed", v.removed, "") : ""}
    <div class="card"><h2>Admin actions</h2>${events.length ? events.map(([h, t]) => `<div class="row"><div>${t}</div><a class="dim" href="#/block/${h}">block #${h}</a></div>`).join("") : '<div class="dim">No changes since genesis.</div>'}</div>`;
};

function txRow(t) {
  return `<div class="row"><div><a href="#/tx/${t.id}">${esc(t.summary)}</a>${t.memo ? ` <span class="dim">“${esc(t.memo)}”</span>` : ""}</div><span class="pill ${t.status}">${t.status}</span></div>`;
}

async function route() {
  const [, view = "", id = ""] = location.hash.split("/");
  const fn = views[view] || views.home;
  try { $("#app").innerHTML = await fn(decodeURIComponent(id)); }
  catch (e) { $("#app").innerHTML = `<div class="card err">🦴 ${esc(e.message)}</div>`; }
}

$("#search").addEventListener("submit", async (e) => {
  e.preventDefault();
  try { const h = await api("/search/" + encodeURIComponent($("#q").value)); location.hash = `#/${h.type}/${h.id}`; }
  catch (err) { $("#app").innerHTML = `<div class="card err">🦴 ${esc(err.message)}</div>`; }
});
window.addEventListener("hashchange", route);
route();
setInterval(() => { if (!location.hash || location.hash === "#/") route(); }, 3000);
</script>
</body>
</html>
