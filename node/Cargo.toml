[package]
name = "blockula"
version = "0.4.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
bech32 = "=0.12.0"
blake3 = "=1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.3"
hex = "0.4.3"
ml-dsa = "=0.1.1"
parking_lot = "0.12.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "timeout"] }
commonware-actor = "=2026.9.0"
commonware-broadcast = "=2026.9.0"
commonware-codec = "=2026.9.0"
commonware-consensus = "=2026.9.0"
commonware-cryptography = "=2026.9.0"
commonware-macros = "=2026.9.0"
commonware-math = "=2026.9.0"
commonware-p2p = "=2026.9.0"
commonware-parallel = "=2026.9.0"
commonware-runtime = "=2026.9.0"
commonware-storage = "=2026.9.0"
# The p2p transport: the vendored hybrid copy ([patch.crates-io] below). A direct dependency so
# the node can reference what only that copy exports (api.rs `p2p_transport`): an unapplied patch
# then fails to compile instead of silently linking the classical handshake.
commonware-stream = "=2026.9.0"
commonware-utils = "=2026.9.0"
bytes = "1"
futures = "0.3"
rand_core = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Outbound HTTPS on aws-lc-rs (installed in `main`), which offers X25519MLKEM768 first. reqwest's
# ring provider stays only as the fallback for code paths that never install one (unit tests).
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std", "tls12"] }
tracing = "0.1"
zstd = "0.13"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# State layer (see src/state): structural-sharing maps, and the canonical record encoding (a
# consensus format, so pinned exactly).
imbl = { version = "=7.0.2", features = ["serde"] }
borsh = { version = "=1.8.1", features = ["derive", "de_strict_order"] }
# Persistence (src/store.rs): the embedded database holding records, tree nodes, the commit point
# and indexes (its file format is ours to keep, so pinned exactly), and the per-block read view
# the API serves from without the consensus lock (src/view.rs).
redb = "=4.4.0"
arc-swap = "=1.9.2"
# Genesis specs and operator files (src/genesis_builder.rs).
toml = "1.1"
# Ghost Mode's cryptographic core (keys, notes, the commitment tree, the Action STARK on Plonky3,
# note encryption): its own workspace, pinned there. Disabled at genesis (src/ghost.rs).
blockula-ghost = { path = "ghost", version = "=0.1.0" }

# ML-DSA and consensus are slow unoptimized; keep our crate debuggable but optimize deps.
[profile.dev.package."*"]
opt-level = 2

# Arithmetic overflow in the node panics in release builds too: halting beats silently wrapping
# a balance or the supply.
[profile.release.package.blockula]
overflow-checks = true

# Ghost Mode's verifier runs on untrusted proofs. Its robustness evidence (docs/GHOST-MODE.md
# sections 7 and 11) was gathered with overflow checks on in blockula-ghost and every Plonky3
# crate, where an overflow on a malformed proof panics (and `verify`'s catch_unwind turns that
# into a rejection) instead of wrapping down an untested path. Cargo applies only this
# workspace's profiles, so they're listed here; `ghost::tests::release_profile_covers_plonky3`
# fails if a p3-* crate in Cargo.lock is missing. `panic` stays "unwind" (the default):
# blockula-ghost refuses to compile with "abort".
[profile.release.package.blockula-ghost]
overflow-checks = true
[profile.release.package.p3-air]
overflow-checks = true
[profile.release.package.p3-challenger]
overflow-checks = true
[profile.release.package.p3-commit]
overflow-checks = true
[profile.release.package.p3-dft]
overflow-checks = true
[profile.release.package.p3-field]
overflow-checks = true
[profile.release.package.p3-fri]
overflow-checks = true
[profile.release.package.p3-keccak]
overflow-checks = true
[profile.release.package.p3-koala-bear]
overflow-checks = true
[profile.release.package.p3-matrix]
overflow-checks = true
[profile.release.package.p3-maybe-rayon]
overflow-checks = true
[profile.release.package.p3-mds]
overflow-checks = true
[profile.release.package.p3-merkle-tree]
overflow-checks = true
[profile.release.package.p3-monty-31]
overflow-checks = true
[profile.release.package.p3-poseidon1]
overflow-checks = true
[profile.release.package.p3-poseidon2]
overflow-checks = true
[profile.release.package.p3-poseidon2-air]
overflow-checks = true
[profile.release.package.p3-security]
overflow-checks = true
[profile.release.package.p3-symmetric]
overflow-checks = true
[profile.release.package.p3-uni-stark]
overflow-checks = true
[profile.release.package.p3-util]
overflow-checks = true

[dev-dependencies]
proptest = "1.12"
tower = { version = "0.5", features = ["util"] }
# SHA-256 of known-answer outputs (src/kat.rs).
sha2 = "0.11"

# The vendored stream crate is a member only so its tests run against this lockfile:
# `cargo test --manifest-path node/Cargo.toml -p commonware-stream`. Plain `cargo test` and
# `cargo build` still act on `blockula` alone.
[workspace]
members = ["vendor/commonware-stream"]
exclude = ["fuzz", "ghost"]

# p2p key exchange: hybrid X25519 + ML-KEM-768 instead of X25519 alone (docs/PQ-TRANSPORT.md).
[patch.crates-io]
commonware-stream = { path = "vendor/commonware-stream" }
